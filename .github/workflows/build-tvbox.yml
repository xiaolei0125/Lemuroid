name: Build TVBox APK

# 为电视盒子（魔百盒等 device-protected storage ROM）构建可安装的 APK。
# 构建 freeBundleDebug 变体：开源版 + 所有核心打包进单 APK，使用仓库自带
# debug.keystore 签名，无需任何 secret。
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (freeBundleDebug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble freeBundleDebug APK
        run: ./gradlew assembleFreeBundleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-tvbox-debug-apk
          path: |
            lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
